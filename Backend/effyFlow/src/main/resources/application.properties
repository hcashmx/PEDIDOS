spring.application.name=EffyFlow

# === BASE DE DATOS ===
# Ejemplo: jdbc:postgresql://localhost:5432/public?characterEncoding=UTF-8&client_encoding=UTF8
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prueba}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / HIBERNATE ===
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.datasource.hikari.connection-init-sql=SET client_encoding TO 'UTF8'
spring.output.ansi.enabled=always
spring.sql.init.encoding=UTF-8
spring.mandatory-file-encoding=UTF-8

# === SERVIDOR ===
server.port=${SERVER_PORT:8080}
server.tomcat.uri-encoding=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.web.locale=es_MX
spring.messages.encoding=UTF-8

# === SEGURIDAD SYNC ===
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-expiration-minutes=${APP_JWT_ACCESS_EXPIRATION_MINUTES:15}
app.jwt.refresh-expiration-days=${APP_JWT_REFRESH_EXPIRATION_DAYS:7}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

erp.base-url=${ERP_BASE_URL:}
spring.config.import=optional:file:.env.local[.properties]
erp.token=${ERP_TOKEN:}
erp.username=${ERP_USERNAME:}
erp.password=${ERP_PASSWORD:}
erp.connect-timeout-ms=${ERP_CONNECT_TIMEOUT_MS:3000}
erp.read-timeout-ms=${ERP_READ_TIMEOUT_MS:15000}
app.cotizaciones.assertion.private-key-base64=${COTIZACION_ASSERTION_PRIVATE_KEY_BASE64:}
app.cotizaciones.assertion.key-id=${COTIZACION_ASSERTION_KEY_ID:}
app.cotizaciones.assertion.issuer=${COTIZACION_ASSERTION_ISSUER:effyflow-sync}
app.cotizaciones.assertion.audience=${COTIZACION_ASSERTION_AUDIENCE:erp-cotizaciones}
app.cotizaciones.assertion.validity-seconds=${COTIZACION_ASSERTION_VALIDITY_SECONDS:60}
